   - name: Extract Android Project
        run: |
          mkdir -p android-project

          echo "Checking repository files..."
          find . -maxdepth 4 -type f

          ZIP_FILE=$(find . -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d android-project
